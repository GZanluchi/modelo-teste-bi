name: Compilar IFC Viewer para Power BI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Gerar arquivo PBIVIZ
    runs-on: ubuntu-latest

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar estrutura do projeto
        run: |
          echo "Arquivos encontrados na raiz:"
          ls -la
          test -f package.json || {
            echo "ERRO: package.json não encontrado na raiz do repositório."
            exit 1
          }

      - name: Instalar dependências do projeto
        run: npm install

      - name: Verificar versão do PBIVIZ
        run: npx pbiviz --version

      - name: Gerar pacote PBIVIZ
        run: npx pbiviz package

      - name: Listar resultado
        run: |
          echo "Conteúdo da pasta dist:"
          ls -la dist

      - name: Disponibilizar arquivo compilado
        uses: actions/upload-artifact@v4
        with:
          name: IFC-Viewer-PowerBI
          path: dist/*.pbiviz
          if-no-files-found: error
          retention-days: 30
``
