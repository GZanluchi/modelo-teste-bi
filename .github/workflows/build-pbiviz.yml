name: Compilar IFC Viewer para Power BI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Preparar Node.js no servidor do GitHub
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm install

      - name: Instalar ferramentas de visuais Power BI
        run: npm install --global powerbi-visuals-tools@latest

      - name: Gerar pacote PBIVIZ
        run: pbiviz package

      - name: Disponibilizar arquivo compilado
        uses: actions/upload-artifact@v4
        with:
          name: IFC-Viewer-PowerBI
          path: dist/*.pbiviz
          if-no-files-found: error
