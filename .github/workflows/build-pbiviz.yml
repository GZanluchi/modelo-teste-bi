name: Compilar IFC Viewer para Power BI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Gerar pacote PBIVIZ
    runs-on: ubuntu-latest

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mostrar arquivos recebidos
        run: |
          echo "Diretório atual:"
          pwd

          echo "Arquivos existentes:"
          find . -maxdepth 3 -type f \
            -not -path "./.git/*" \
            | sort

      - name: Organizar estrutura do projeto
        run: |
          mkdir -p assets
          mkdir -p src
          mkdir -p style

          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
            echo "icon.png copiado para assets/icon.png"
          fi

          if [ -f "visual.ts" ]; then
            cp visual.ts src/visual.ts
            echo "visual.ts copiado para src/visual.ts"
          fi

          if [ -f "visual.less" ]; then
            cp visual.less style/visual.less
            echo "visual.less copiado para style/visual.less"
          fi

      - name: Verificar arquivos obrigatórios
        run: |
          test -f package.json || {
            echo "ERRO: package.json não encontrado."
            exit 1
          }

          test -f pbiviz.json || {
            echo "ERRO: pbiviz.json não encontrado."
            exit 1
          }

          test -f capabilities.json || {
            echo "ERRO: capabilities.json não encontrado."
            exit 1
          }

          test -f tsconfig.json || {
            echo "ERRO: tsconfig.json não encontrado."
            exit 1
          }

          test -f assets/icon.png || {
            echo "ERRO: assets/icon.png não foi encontrado."
            exit 1
          }

          test -f src/visual.ts || {
            echo "ERRO: src/visual.ts não foi encontrado."
            exit 1
          }

          test -f style/visual.less || {
            echo "ERRO: style/visual.less não foi encontrado."
            exit 1
          }

          echo "Todos os arquivos obrigatórios foram encontrados."

      - name: Validar arquivos JSON
        run: |
          node <<'NODE'
          const fs = require("fs");

          const files = [
            "package.json",
            "pbiviz.json",
            "capabilities.json",
            "tsconfig.json"
          ];

          let invalidFileFound = false;

          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, "utf8"));
              console.log("VALIDO: " + file);
            } catch (error) {
              invalidFileFound = true;
              console.error("INVALIDO: " + file);
              console.error(error.message);
            }
          }

          if (invalidFileFound) {
            process.exit(1);
          }
          NODE

      - name: Mostrar estrutura organizada
        run: |
          echo "Estrutura usada na compilação:"
          find . -maxdepth 3 -type f \
            -not -path "./.git/*" \
            | sort

          echo "Informações do ícone:"
          file assets/icon.png
          ls -la assets/icon.png

      - name: Instalar dependências
        run: npm install

      - name: Mostrar versões
        run: |
          node --version
          npm --version
          npx pbiviz --version

      - name: Gerar pacote PBIVIZ
        run: npx pbiviz package

      - name: Verificar pacote gerado
        run: |
          echo "Conteúdo da pasta dist:"
          ls -la dist

          PBIVIZ_FILE="$(find dist -maxdepth 1 -type f -name '*.pbiviz' -print -quit)"

          if [ -z "$PBIVIZ_FILE" ]; then
            echo "ERRO: nenhum arquivo .pbiviz foi gerado."
            exit 1
          fi

          echo "Pacote PBIVIZ gerado:"
          echo "$PBIVIZ_FILE"

      - name: Disponibilizar arquivo compilado
        uses: actions/upload-artifact@v4
        with:
          name: IFC-Viewer-PowerBI
          path: dist/*.pbiviz
          if-no-files-found: error
          retention-days: 30
